<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/inscription.css"  >
    <title>connexion</title>
</head>
<body>
    <div class="form">

        <div id="inscription-img" > </div>

        <div id="inscription">
            <form action="index.html">

                <div class="element">
                    <label for="nom">Nom</label>
                    <input type="text" name="nom" id="nom" placeholder="Nom">
                </div>

                <div class="element">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="email">
                </div class="element">

                <div class="element">
                    <label for="password">Mot de passe</label>
                    <input type="password" name="password" id="password" placeholder="mdp">
                </div>

                <div class="element">
                    <label for="cpswd">Confirmation de mot de passe</label>
                    <input type="password" name="cpswd" id="cpswd" placeholder="confirm mdp">
                </div>

                <button id="btn">Se connecter</button>
            </form>
        </div>
    </div>
    <p id="email-message">
        coucou
    </p>

    <script src="script.js"></script>
    <script type="module" src="meteo.js"></script>
    
    
</body>



</html>
