<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connexion</title>
    <link rel="stylesheet" href="style/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main>
        
        <div class="left">
            <img src="" alt="">
        </div>

        <div class="right">
            <form id="form-login" method="POST">

                <div class="element">
                    <label for="nom">Email</label>
                    <input type="email" name="nom" id="email" placeholder="Nom">
                </div>

                <div class="element">
                    <label for="mdp">Mot de passe</label>
                    <input type="password" name="mdp" id="mdp" placeholder="mdp">
                </div>

                <button id="btn">Connexion</button>

            </form>
        </div>

    </main>
    
</body>

    <script>

        const SUPABASE_URL = "https://tzugubrpoizirgufhozn.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dWd1YnJwb2l6aXJndWZob3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTY1ODEsImV4cCI6MjEwNzA3MjU4MX0.q8GrSI-3MpTeKgHSHwp8q4QcU7uA_SeYavW4uwHFJj0"; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("mdp");

document.getElementById("form-login").addEventListener("submit", async (e) => { 
    e.preventDefault(); 

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
    });

    if (error) {
        console.error("Erreur Supabase :", error.message);
        alert("Erreur de connexion : " + error.message);
    } else {
        window.location.href = "discussion.html";

    }
});
    </script>

</html>
